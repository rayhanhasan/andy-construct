# n8n + Umami sur un VPS suisse (Infomaniak, 2 vCPU / 4 Go), derrière Caddy (HTTPS automatique).
# Installation pas à pas : docs/v2/automatisation.md §4.
#
#   cp n8n/parametres.env.example .env    # puis remplir .env (jamais versionné)
#   docker compose up -d
#
# Données persistantes dans ./donnees/ (sauvegardé par l'instantané quotidien du VPS).
name: andy-construct

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ./donnees/postgres:/var/lib/postgresql/data
      - ./init-umami.sql:/docker-entrypoint-initdb.d/init-umami.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      N8N_HOST: ${N8N_DOMAINE}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_DOMAINE}/
      GENERIC_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Exécutions conservées 30 jours au plus (720 h), puis supprimées.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      # Les nœuds Code utilisent crypto (HMAC) et lisent les variables AC_* :
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "true"
    volumes:
      - ./donnees/n8n:/home/node/.n8n

  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-postgresql-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAINE: ${N8N_DOMAINE}
      UMAMI_DOMAINE: ${UMAMI_DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./donnees/caddy:/data

; Réglages PHP propres au dossier api/ (PHP-FPM / CGI : Infomaniak, Hostinger…).
; Pris en compte après quelques minutes (user_ini.cache_ttl).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
upload_max_filesize = 8M
post_max_size = 26M
max_file_uploads = 5
max_execution_time = 60
memory_limit = 192M
